name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7.0.1

      - name: Validate HTML and internal links
        run: python scripts/check_site.py

      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/consent.js
