name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7.0.1

      - name: Validate HTML and internal links
        run: python scripts/check_site.py

      - name: Check JavaScript syntax
        run: |
          node --check js/main.js
          node --check js/consent.js
          node --check js/guide.js
          node --check js/enquiry.js
          node --check js/mfa-guide.js
          node --check js/resources-revamp.js
          node --check js/command-menu.js
          node --check js/product-explorer.js
          node --check js/build-planner.js
          node --check scripts/build_guide_pdfs.mjs
