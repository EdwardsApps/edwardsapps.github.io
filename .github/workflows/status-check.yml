name: Status check

# Reads every service's status feed and stores the result on the status-data branch,
# which status.html loads directly. Nothing on main changes, so the site is not rebuilt.
#
# GitHub's timer often runs late and sometimes skips a slot, so it is asked every five
# minutes. The job itself does nothing unless the last check is at least nine minutes old,
# which gives a check about every ten minutes when the timer behaves and the best GitHub
# can manage when it does not. Starting the job by hand always runs a check.
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read the status feeds and store the readings
        env:
          STATUS_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          STATUS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: bash scripts/status_publish.sh
