name: Status check

# Reads every service's status feed and stores the result on the status-data branch,
# which status.html loads directly. Nothing on main changes, so the site is not rebuilt.
#
# The regular checks come from the "Status timer" workflow, which keeps itself going.
# This workflow is the safety net around it. It runs when GitHub's scheduler fires (which
# is late, patchy and at times not at all), whenever the site is updated, and when started
# by hand. Each time, it checks the services if the last check is getting old (14 minutes;
# a run started by hand always checks) and then starts either timer if it has stopped.
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the site
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read the status feeds and store the readings
        env:
          STATUS_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          STATUS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # The timer checks about every ten minutes. Only step in when it is running late.
          STATUS_MIN_GAP_SECONDS: '840'
        run: bash scripts/status_publish.sh

      - name: Make sure the timers are running
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/status_timer.py ensure
